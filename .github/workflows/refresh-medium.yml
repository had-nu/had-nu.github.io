name: refresh-medium-writing

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh Medium posts
        run: python3 scripts/refresh-medium.py

      - name: Commit changes if any
        run: |
          if git diff --quiet -- writing/medium-posts.json; then
            echo "No changes to medium-posts.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add writing/medium-posts.json
            git commit -m "chore: refresh latest writing from Medium feed"
            git push
          fi